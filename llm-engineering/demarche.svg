<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">La démarche de LLM_finetuning</title>
  <desc id="d">Cinq références et techniques, de la borne basse à la distillation, chacune devant battre la précédente ; puis un protocole gelé, des comparaisons appariées, un verdict en trois valeurs et un test scellé ouvert une seule fois.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
  </defs>
  <rect width="900" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Chaque marche doit battre la précédente, réglée à budget égal</text>

  <g font-size="13" text-anchor="middle" fill="#1f2328">
    <rect x="24"  y="52" width="152" height="68" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="100" y="82">Borne basse</text><text x="100" y="101" font-size="11.5" fill="#57606a">classe majoritaire</text>

    <rect x="196" y="52" width="152" height="68" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="272" y="82">TF-IDF</text><text x="272" y="101" font-size="11.5" fill="#57606a">régression logistique</text>

    <rect x="368" y="52" width="152" height="68" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="444" y="82">Encodeur</text><text x="444" y="101" font-size="11.5" fill="#57606a">BERT biomédical</text>

    <rect x="540" y="52" width="152" height="68" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="616" y="82">LLM + LoRA</text><text x="616" y="101" font-size="11.5" fill="#57606a">référence des LLM</text>

    <rect x="712" y="52" width="164" height="68" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="794" y="82">Distillation</text><text x="794" y="101" font-size="11.5" fill="#57606a">et pré-entraînement voisin</text>
  </g>
  <g stroke="#57606a" stroke-width="1.6" marker-end="url(#a)">
    <line x1="178" y1="86" x2="194" y2="86"/>
    <line x1="350" y1="86" x2="366" y2="86"/>
    <line x1="522" y1="86" x2="538" y2="86"/>
    <line x1="694" y1="86" x2="710" y2="86"/>
  </g>

  <line x1="24" y1="150" x2="876" y2="150" stroke="#d0d7de"/>
  <text x="450" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Et un cadre qui empêche de se raconter des histoires</text>

  <g font-size="13" text-anchor="middle" fill="#1f2328">
    <rect x="24"  y="196" width="200" height="82" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="124" y="226">Protocole gelé</text><text x="124" y="245" font-size="11.5" fill="#57606a">écrit et haché (SHA-256)</text><text x="124" y="262" font-size="11.5" fill="#57606a">avant la première mesure</text>

    <rect x="244" y="196" width="200" height="82" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="344" y="226">Comparaisons appariées</text><text x="344" y="245" font-size="11.5" fill="#57606a">mêmes patients, mêmes plis,</text><text x="344" y="262" font-size="11.5" fill="#57606a">intervalles de confiance</text>

    <rect x="464" y="196" width="232" height="82" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="580" y="226">Verdict en trois valeurs</text><text x="580" y="245" font-size="11.5" fill="#57606a">gain confirmé · pas de gain utile</text><text x="580" y="262" font-size="11.5" fill="#57606a">· non résolu</text>

    <rect x="716" y="196" width="160" height="82" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="796" y="226">Test scellé</text><text x="796" y="245" font-size="11.5" fill="#57606a">ouvert une seule fois,</text><text x="796" y="262" font-size="11.5" fill="#57606a">journal d'accès</text>
  </g>
  <g stroke="#57606a" stroke-width="1.6" marker-end="url(#a)">
    <line x1="226" y1="237" x2="242" y2="237"/>
    <line x1="446" y1="237" x2="462" y2="237"/>
    <line x1="698" y1="237" x2="714" y2="237"/>
  </g>
</svg>
